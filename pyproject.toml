[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teacher"
version = "0.1.0"
description = "Turn ML papers into podcast-style audio with local models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "mineru[full]>=4.2",
    "pydantic-ai-slim[openai]>=2.31.1",
    "semchunk>=4.1",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
    "typer>=0.20.0",
    "vllm-omni==0.30.0",
]

[project.scripts]
teacher = "teacher.cli:app"

[tool.uv]
package = true
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
markers = ["slow: loads real models"]
