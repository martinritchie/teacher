[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teacher"
version = "0.1.0"
description = "Turn ML papers into podcast-style audio with local models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.108,<1",
    "jinja2>=3.1",
    "mineru[full]>=4.2",
    "num2words>=0.5.14",
    "pydantic-ai-slim[anthropic,openai]>=2.31.1",
    "semchunk>=4.1",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
    "typer>=0.20.0",
    "vllm-omni==0.30.0",
]

[project.scripts]
teacher = "teacher.cli:main"

[tool.uv]
package = true
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not functional"]  # importlib: pytest's recommendation for new projects. A later -m replaces this one.
markers = ["functional: real models, GPU, network or processes; too slow for the unit tests, run by make test-functional"]

[tool.coverage.run]
source = ["teacher"]
branch = true
omit = ["*/teacher/testing.py"]  # helpers for the tests themselves

[tool.coverage.report]
show_missing = true
skip_covered = false
