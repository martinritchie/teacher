[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teacher"
version = "0.1.0"
description = "Multi-agent research paper to audio transcript system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kokoro>=0.9.4",
    "ollama>=0.6.3",
    "pymupdf4llm>=2.1",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
    "typer>=0.20.0",
]

[project.scripts]
teacher = "teacher.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
markers = ["slow: loads real models"]
